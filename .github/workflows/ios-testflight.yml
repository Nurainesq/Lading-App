name: iOS TestFlight

# Manual only. It needs Apple credentials that live in repository secrets, and
# a macOS runner, so it must never fire on an ordinary push.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Absolute API origin the build talks to, e.g. https://api.lading.app'
        required: true
        type: string
      build_number:
        description: 'CFBundleVersion. Must be higher than the last upload.'
        required: true
        type: string

jobs:
  testflight:
    name: Build and upload to TestFlight
    # Xcode only exists on macOS runners; this cannot run on ubuntu.
    runs-on: macos-14
    timeout-minutes: 60

    env:
      APP_ID: app.lading.mobile
      SCHEME: App
      XCODE_PROJECT: apps/web/ios/App/App.xcodeproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The native shell wraps exactly the same web build that ships to the
      # browser, so the screens cannot drift between the two.
      - name: Build the web app
        run: |
          npm run build -w @lading/shared
          npm run build -w @lading/web
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url }}

      - name: Add the iOS project
        working-directory: apps/web
        run: |
          # The generated project is not committed — it is derived from
          # capacitor.config.ts, and regenerating keeps it honest.
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: apps/web/ios/App
        run: pod install --repo-update

      # Signing material arrives base64-encoded in secrets and is imported
      # into a throwaway keychain that dies with the runner.
      - name: Set up signing
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/build.mobileprovision

          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Set the build number
        working-directory: apps/web/ios/App
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" App/Info.plist

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -workspace apps/web/ios/App/App.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lading.xcarchive" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
            clean archive

      - name: Export the ipa
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${APP_ID}</key>
              <string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lading.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      # An App Store Connect API key rather than an Apple ID, so the upload
      # does not stall on two-factor auth.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/App.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Keep the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lading-ios-${{ inputs.build_number }}
          path: ${{ runner.temp }}/export
          if-no-files-found: ignore
          retention-days: 14
