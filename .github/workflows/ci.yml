name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The shared package is compiled first — both apps typecheck against its
      # emitted declarations, not its source.
      - name: Build shared
        run: npm run build -w @lading/shared

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      # Money arithmetic, the deal state machine, and webhook signature
      # verification. These are the parts that must not be wrong.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
